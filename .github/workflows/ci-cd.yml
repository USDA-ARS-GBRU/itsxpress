name: CI/CD Pipeline (Test & Publish Docker)

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "0 0 1 * *"
  push:
    branches:
      - main

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        environment: [release_2026_7, latest_dev]
        include:
          # Normal release testing: main branch, tags, manual triggers, push
          - environment: release_2026_7
            env_url: "https://raw.githubusercontent.com/qiime2/distributions/refs/heads/dev/2026.7/qiime2/released/rachis-qiime2-linux-64-conda.yml"
            run_this_leg: ${{ github.event_name != 'schedule' }}
          # Scheduled dev testing: only schedule event
          - environment: latest_dev
            env_url: "https://raw.githubusercontent.com/qiime2/distributions/refs/heads/dev/latest/passed/rachis-qiime2-linux-64-conda.yml"
            run_this_leg: ${{ github.event_name == 'schedule' }}

    # Cleanest fix: Skip the entire matrix leg immediately at the job level if not needed
    if: matrix.run_this_leg

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Initiate Conda Channels
        uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge,bioconda,default
          auto-activate-base: true

      - name: Initialize Conda
        run: conda info

      - name: Set up QIIME Conda environment
        run: |
          conda env create -n testenv --file=${{ matrix.env_url }}

      - name: Install Dependencies
        run: |
          conda activate testenv
          conda install -y biopython=1.84 pip pyzstd pytest
          pip install .

      - name: Test with pytest
        run: |
          conda activate testenv
          pytest

      - name: Test QIIME Plugin Integration
        run: |
          conda activate testenv
          qiime dev refresh-cache
          qiime itsxpress --help

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.ref == 'refs/heads/main' || 
      startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Tag
        id: get_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "IMAGE_TAG=v${VERSION}" >> $GITHUB_ENV
          else
            SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)
            echo "IMAGE_TAG=sha-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Build and push itsxpress image with caching
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/usda-ars-gbru/itsxpress:${{ env.IMAGE_TAG }}
            ghcr.io/usda-ars-gbru/itsxpress:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless sign container image
        run: |
          cosign sign \
            ghcr.io/usda-ars-gbru/itsxpress:${{ env.IMAGE_TAG }}
