name: CI/CD Pipeline (Test & Publish Docker)

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "17 14 * * 0" # Runs on Sunday at 14:17 UTC
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # =========================================================================
  # JOB 1: Test against stable release (Runs on pushes, tags, manual triggers)
  # =========================================================================
  test-stable:
    name: Run Stable Integration Tests (2026.7)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initiate Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge,bioconda,defaults
          auto-activate-base: true

      - name: Set up QIIME Conda environment
        run: |
          conda env create -n testenv --file="https://raw.githubusercontent.com/qiime2/distributions/refs/heads/dev/2026.7/qiime2/released/rachis-qiime2-linux-64-conda.yml"

      - name: Install Dependencies & Package
        run: |
          conda activate testenv
          conda install -y -c conda-forge pyzstd==0.19.1 
          pip install biopython==1.88 .

      - name: Test with pytest
        run: |
          conda activate testenv
          pytest

      - name: Test QIIME Plugin Integration
        run: |
          conda activate testenv
          qiime dev refresh-cache
          qiime itsxpress --help

  # =========================================================================
  # JOB 2: Test against bleeding edge (Runs ONLY on weekly cron schedule)
  # =========================================================================
  test-latest-dev:
    name: Run Weekly Dev Integration Tests (Latest)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initiate Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge,bioconda,defaults
          auto-activate-base: true

      - name: Set up QIIME Conda environment
        run: |
          conda env create -n testenv --file="https://raw.githubusercontent.com/qiime2/distributions/refs/heads/dev/latest/passed/rachis-qiime2-linux-64-conda.yml"

      - name: Install Dependencies & Package
        run: |
          conda activate testenv
          conda install -y -c conda-forge "pyzstd>=0.19.1,<0.20.0" 
          pip install biopython==1.88 .

      - name: Test with pytest
        run: |
          conda activate testenv
          pytest

      - name: Test QIIME Plugin Integration
        run: |
          conda activate testenv
          qiime dev refresh-cache
          qiime itsxpress --help

  # =========================================================================
  # JOB 3: Build, Publish, and Cryptographically Sign the Docker Image
  # =========================================================================
  docker:
    name: Build and Push Docker Image
    needs: [test-stable, test-latest-dev]
    # Explicit status checking: safely runs when test-stable passes and test-latest-dev is skipped
    if: |
      github.event_name != 'schedule' &&
      needs.test-stable.result == 'success' &&
      (needs.test-latest-dev.result == 'success' || needs.test-latest-dev.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Tag
        id: get_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "IMAGE_TAG=v${VERSION}" >> $GITHUB_ENV
          else
            SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)
            echo "IMAGE_TAG=sha-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Build and push itsxpress image with caching
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker-images/Dockerfile
          push: true
          tags: |
            ghcr.io/usda-ars-gbru/itsxpress:${{ env.IMAGE_TAG }}
            ghcr.io/usda-ars-gbru/itsxpress:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless sign container image
        run: cosign sign --yes ghcr.io/usda-ars-gbru/itsxpress:${{ env.IMAGE_TAG }}
