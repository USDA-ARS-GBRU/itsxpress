name: CI/CD Pipeline (Test & Publish Docker)

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "0 0 1 * *"
  push:
    branches:
      - main

# Explicitly grant permissions required for keyless signing and package publishing
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Run Integration Tests (${{ matrix.environment }})
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: release_2026_7
            env_url: "https://githubusercontent.com"
            biopython_ver: "1.88"
            pyzstd_ver: "==0.19.1"

          - environment: latest_dev
            env_url: "https://githubusercontent.com"
            biopython_ver: "1.88"
            pyzstd_ver: ">=0.19.1,<0.20.0"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Clean Step-Level Filtering: Safely handles your cron vs push strategy
      - name: Check Trigger Event Eligibility
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ matrix.environment }}" != "latest_dev" ]; then
            echo "Skipping stable release test for scheduled nightly check."
            exit 0
          elif [ "${{ github.event_name }}" != "schedule" ] && [ "${{ matrix.environment }}" == "latest_dev" ]; then
            echo "Skipping latest dev test for standard push/release trigger."
            exit 0
          fi

      # Removed actions/setup-python completely to speed up execution
      - name: Initiate Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge,bioconda,defaults
          auto-activate-base: true

      - name: Set up QIIME Conda environment
        run: conda env create -n testenv --file=${{ matrix.env_url }}

      - name: Install Dependencies & Package
        run: |
          conda activate testenv
          conda install -y -c conda-forge pyzstd${{ matrix.pyzstd_ver }} biopython=${{ matrix.biopython_ver }}
          pip install .

      - name: Test with pytest
        run: |
          conda activate testenv
          pytest

      - name: Test QIIME Plugin Integration
        run: |
          conda activate testenv
          qiime dev refresh-cache
          qiime itsxpress --help

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.ref == 'refs/heads/main' || 
      startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Tag
        id: get_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "IMAGE_TAG=v${VERSION}" >> $GITHUB_ENV
          else
            SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)
            echo "IMAGE_TAG=sha-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Build and push itsxpress image with caching
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker-images/Dockerfile
          push: true
          tags: |
            ghcr.io/usda-ars-gbru/itsxpress:${{ env.IMAGE_TAG }}
            ghcr.io/usda-ars-gbru/itsxpress:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Added robust conditional execution so Cosign only attempts to sign on actual image pushes
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless sign container image
        run: cosign sign --yes ghcr.io/usda-ars-gbru/itsxpress:${{ env.IMAGE_TAG }}
