name: CI/CD Pipeline (Test & Publish Docker)

on:
  release:
    types: [published]
  schedule:
    - cron: "0 0 1 * *" # Runs exactly once a month on the 1st at midnight UTC
  push:
    branches:
      - main # Allows manual or push testing on main to verify pipeline updates

jobs:
  # JOB 1: Test your code inside the target environment
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        # Define the two build variants
        environment: [release_2026_7, latest_dev]
        # Include specific variables for each matrix variant
        include:
          - environment: release_2026_7
            env_url: "https://raw.githubusercontent.com/qiime2/distributions/refs/heads/dev/2026.7/qiime2/released/rachis-qiime2-linux-64-conda.yml"
          - environment: latest_dev
            env_url: "https://raw.githubusercontent.com/qiime2/distributions/refs/heads/dev/latest/passed/rachis-qiime2-linux-64-conda.yml"

    steps:
      # CRITICAL FILTER: Skip 'latest_dev' matrix leg on push/release, and skip 'release_2026_7' leg on schedule.
      - name: Check trigger event compatibility
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ matrix.environment }}" != "latest_dev" ]]; then
            echo "Skipping stable release test for scheduled monthly build."
            exit 0
          elif [[ "${{ github.event_name }}" != "schedule" && "${{ matrix.environment }}" != "release_2026_7" ]]; then
            echo "Skipping dev test for push/release build."
            exit 0
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Initiate Conda Channels
        uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge,bioconda,default
          auto-activate-base: true

      - name: Initialize Conda
        run: conda info

      - name: Set up QIIME Conda environment
        run: |
          conda env create -n testenv --file=${{ matrix.env_url }}

      - name: Install Dependencies
        run: |
          conda activate testenv
          conda install -y biopython=1.84 pip pyzstd pytest
          pip install .

      - name: Test with pytest
        run: |
          conda activate testenv
          pytest

      - name: Test QIIME Plugin Integration
        run: |
          conda activate testenv
          qiime dev refresh-cache
          qiime itsxpress --help

  # JOB 2: Compile & Push the Container (Only runs if Job 1 passes)
  docker:
    name: Build and Push Docker Image
    needs: test # CRITICAL: This blocks container pushes if tests fail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: slug
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - name: Build and push itsxpress image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/usda-ars-gbru/itsxpress:sha-${{ env.SHORT_SHA }}
            ghcr.io/usda-ars-gbru/itsxpress:latest
