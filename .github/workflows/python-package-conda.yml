name: GitHub Actions Monthly Build (V2)

on:
  release:
    types: [published]
  schedule:
    - cron: "0 0 1 * *" # Runs exactly once a month on the 1st at midnight UTC

jobs:
  test-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Match Python version with the QIIME 2026.7 environment standard
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Initiate Conda Channels
        uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge,bioconda,default
          auto-activate-base: true

      - name: Initialize Conda
        run: conda info

      # Upgraded environment file url to match your 2026.7 Docker image base
      - name: Set up QIIME Conda environment
        run: |
          conda env create -n testenv --file=https://qiime2.org

      - name: Install Dependencies
        run: |
          conda activate testenv
          conda install -y biopython=1.84
          pip install pyzstd pytest
          pip install .

      - name: Test with pytest
        run: |
          conda activate testenv
          pytest

      - name: Test QIIME Plugin Integration
        run: |
          conda activate testenv
          qiime dev refresh-cache
          qiime itsxpress --help
